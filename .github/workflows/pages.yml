name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_SITE: https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare static portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=public \
            "$SOURCE_SITE/"

          fetch_asset() {
            local asset="$1"
            mkdir -p "public/$(dirname "$asset")"
            curl --fail --silent --show-error --location \
              "$SOURCE_SITE/$asset" \
              --output "public/$asset"
          }

          # Fetch responsive and gallery assets that are not all present in
          # the initial server-rendered gallery state.
          for asset in \
            images/hero-silhouette-1280.webp \
            images/pavel-photo-320.webp \
            images/hero-ui-ux-designer.svg \
            images/rare-parts-1820.webp \
            images/rare-parts-960.webp \
            images/education/tripleten.webp \
            images/education/skillbox.webp \
            images/education/coursera.svg \
            images/education/mapping.svg \
            icons/arrow-left.svg \
            icons/arrow-right.svg
          do
            fetch_asset "$asset"
          done

          for project in appexbots greenplog
          do
            for i in {0..8}
            do
              fetch_asset "images/apps/$project/$i.webp"
              fetch_asset "images/apps/$project/thumb-$i.webp"
            done
          done

          for i in {1..16}
          do
            fetch_asset "images/beyond/$i.webp"
          done

          # wget does not retain JavaScript module scripts reliably.
          # Fetch every hashed JS/CSS asset referenced by the rendered HTML.
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.request import urlopen

          public = Path("public")
          source = os.environ["SOURCE_SITE"].rstrip("/")
          html = (public / "index.html").read_text(encoding="utf-8")
          pattern = re.compile(r"(?:https?://[^/]+/|/)?(assets/[A-Za-z0-9._~-]+\.(?:js|css))")
          assets = list(dict.fromkeys(pattern.findall(html)))

          for asset in assets:
              target = public / asset
              target.parent.mkdir(parents=True, exist_ok=True)
              if not target.exists():
                  with urlopen(f"{source}/{asset}") as response:
                      target.write_bytes(response.read())

          if not any((public / "assets").glob("index-*.js")):
              raise SystemExit("Missing hydration entry module")
          PY

          test -f public/index.html
          test -f public/images/hero-silhouette-1280.webp
          test -f public/images/pavel-photo-320.webp
          test -f public/images/apps/appexbots/8.webp
          test -f public/images/apps/greenplog/8.webp
          test -f public/images/beyond/16.webp
          cp public/index.html public/404.html
          touch public/.nojekyll

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site/":
                  "https://pubblegun.github.io/",
              "https://pavelpushkin.design/":
                  "https://pubblegun.github.io/",
          }

          for filename in ("index.html", "404.html"):
              path = Path("public") / filename
              html = path.read_text(encoding="utf-8")
              for source, target in replacements.items():
                  html = html.replace(source, target)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish static branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git init -b gh-pages
          git config user.name "PubbleGun"
          git config user.email "cappaulgunner@gmail.com"
          git add -A
          git commit -m "Publish portfolio"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
