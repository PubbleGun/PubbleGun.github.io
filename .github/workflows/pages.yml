name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_SITE: https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare static portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=public \
            "$SOURCE_SITE/"

          test -f public/index.html
          cp public/index.html public/404.html
          touch public/.nojekyll

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site/":
                  "https://pubblegun.github.io/",
              "https://pavelpushkin.design/":
                  "https://pubblegun.github.io/",
          }

          for filename in ("index.html", "404.html"):
              path = Path("public") / filename
              html = path.read_text(encoding="utf-8")
              for source, target in replacements.items():
                  html = html.replace(source, target)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish static branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git init -b gh-pages
          git config user.name "PubbleGun"
          git config user.email "cappaulgunner@gmail.com"
          git add -A
          git commit -m "Publish portfolio"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
