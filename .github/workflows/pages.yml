name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Olivaw source revision: 0ae4f115f1046d48a76afb9d40b00196ed69b65a
  SOURCE_SITE: https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site
  OLIVAW_SITE: https://olivaw.pubblegunn.chatgpt.site
  # Olivaw landing source revision: 8ec410c666851c889693393b02fbc23e4a034ea1
  OLIVAW_LANDING_SITE: https://olivaw-landing.pubblegunn.chatgpt.site

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare static portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=public \
            "$SOURCE_SITE/"

          fetch_asset() {
            local asset="$1"
            mkdir -p "public/$(dirname "$asset")"
            curl --fail --silent --show-error --location \
              "$SOURCE_SITE/$asset" \
              --output "public/$asset"
          }

          # Fetch responsive and gallery assets that are not all present in
          # the initial server-rendered gallery state.
          for asset in \
            images/hero-silhouette-1280.webp \
            images/pavel-photo-320.webp \
            images/hero-ui-ux-designer.svg \
            images/rare-parts-1820.webp \
            images/rare-parts-960.webp \
            images/education/tripleten.webp \
            images/education/skillbox.webp \
            images/education/coursera.svg \
            images/education/mapping.svg \
            icons/arrow-left.svg \
            icons/arrow-right.svg
          do
            fetch_asset "$asset"
          done

          for project in appexbots greenplog
          do
            for i in {0..8}
            do
              fetch_asset "images/apps/$project/$i.webp"
              fetch_asset "images/apps/$project/thumb-$i.webp"
            done
          done

          for i in {1..16}
          do
            fetch_asset "images/beyond/$i.webp"
          done

          # wget does not retain JavaScript module scripts reliably.
          # Extract every hashed JS/CSS URL from HTML and fetch it with curl.
          while IFS= read -r asset
          do
            fetch_asset "$asset"
          done < <(
            grep -oE '(https?://[^/" ]+/)?/?assets/[A-Za-z0-9._~-]+\.(js|css)' public/index.html |
              sed -E 's#https?://[^/]+/##; s#^/##' |
              sort -u
          )

          find public/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit |
            grep -q .

          test -f public/index.html
          test -f public/images/hero-silhouette-1280.webp
          test -f public/images/pavel-photo-320.webp
          test -f public/images/apps/appexbots/8.webp
          test -f public/images/apps/greenplog/8.webp
          test -f public/images/beyond/16.webp
          cp public/index.html public/404.html
          touch public/.nojekyll

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "https://pavel-pushkin-portfolio-2026.pubblegunn.chatgpt.site/":
                  "https://pubblegun.github.io/",
              "https://pavelpushkin.design/":
                  "https://pubblegun.github.io/",
          }

          for filename in ("index.html", "404.html"):
              path = Path("public") / filename
              html = path.read_text(encoding="utf-8")
              for source, target in replacements.items():
                  html = html.replace(source, target)
              path.write_text(html, encoding="utf-8")
          PY

          # Mirror the standalone Olivaw case study under /olivaw/.
          mkdir -p public/olivaw
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=public/olivaw \
            "$OLIVAW_SITE/"

          fetch_olivaw_asset() {
            local asset="$1"
            mkdir -p "public/olivaw/$(dirname "$asset")"
            curl --fail --silent --show-error --location \
              "$OLIVAW_SITE/$asset" \
              --output "public/olivaw/$asset"
          }

          # Source elements and preload hints are not always mirrored by wget.
          for asset in \
            assets/gantari-normal.woff2 \
            assets/gantari-italic.woff2 \
            assets/hero-bg.webp \
            assets/hero-object.webp \
            assets/primary-bg.webp \
            assets/primary-lockup.svg \
            assets/logo-card-texture-exact.png \
            assets/card-symbol-light-exact.svg \
            assets/card-mini-light-exact.svg \
            assets/card-word-light-exact.svg \
            assets/card-symbol-blue-exact.svg \
            assets/card-mini-blue-exact.svg \
            assets/card-word-blue-exact.svg \
            assets/card-symbol-dark-exact.svg \
            assets/card-mini-dark-exact.svg \
            assets/card-word-dark-exact.svg \
            assets/alt-bg.webp \
            assets/alternative-lockup.svg \
            assets/type-a-composition.svg \
            assets/badge.webp \
            assets/exhibition.webp \
            assets/sticker-bg.webp \
            assets/robot.webp
          do
            fetch_olivaw_asset "$asset"
          done

          test -f public/olivaw/index.html
          test -f public/olivaw/styles.css
          test -f public/olivaw/script.js
          test -f public/olivaw/assets/hero-bg.webp
          test -f public/olivaw/assets/exhibition.webp
          test -f public/olivaw/assets/primary-lockup.svg
          test -f public/olivaw/assets/alternative-lockup.svg
          test -f public/olivaw/assets/type-a-composition.svg
          cp public/olivaw/index.html public/olivaw/404.html


          # Mirror the standalone Olivaw landing page under /olivaw_landing/.
          mkdir -p public/olivaw_landing
          wget \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --directory-prefix=public/olivaw_landing \
            "$OLIVAW_LANDING_SITE/"

          fetch_olivaw_landing_asset() {
            local asset="$1"
            mkdir -p "public/olivaw_landing/$(dirname "$asset")"
            curl --fail --silent --show-error --location \
              "$OLIVAW_LANDING_SITE/$asset" \
              --output "public/olivaw_landing/$asset"
          }

          for asset in \
            styles.css \
            script.js \
            assets/gantari-normal.woff2 \
            assets/gantari-italic.woff2 \
            assets/hero-hands.webp \
            assets/hero-dashboard.webp \
            assets/capability-connect.webp \
            assets/capability-control.webp \
            assets/capability-upskill.webp \
            assets/glass-form.webp \
            assets/integrations-lobby.webp \
            assets/product-ui.webp \
            assets/scan-robot.webp \
            assets/scan-heading.png \
            assets/field-phone.webp \
            assets/final-cta.webp \
            assets/olivaw-wordmark.svg \
            assets/chevron.svg \
            assets/arrow-white.svg \
            assets/arrow-dark.svg \
            assets/icon-robots.svg \
            assets/icon-building.svg \
            assets/icon-tasks.svg \
            assets/icon-ai.svg \
            assets/status-dot.svg \
            assets/sticker-symbol.svg \
            assets/sticker-text.svg \
            assets/sticker-code.svg \
            assets/sticker-qr.svg
          do
            fetch_olivaw_landing_asset "$asset"
          done

          test -f public/olivaw_landing/index.html
          test -f public/olivaw_landing/styles.css
          test -f public/olivaw_landing/script.js
          test -f public/olivaw_landing/assets/hero-hands.webp
          test -f public/olivaw_landing/assets/product-ui.webp
          test -f public/olivaw_landing/assets/final-cta.webp
          cp public/olivaw_landing/index.html public/olivaw_landing/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish static branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd public
          git init -b gh-pages
          git config user.name "PubbleGun"
          git config user.email "cappaulgunner@gmail.com"
          git add -A
          git commit -m "Publish portfolio"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
